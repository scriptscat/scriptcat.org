server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 设置404错误页面
    error_page 404 @handle_404;
    
    # 处理404页面的逻辑
    location @handle_404 {
        # 带语言前缀的路径返回该语言的404页面。
        # 默认 locale（zh-Hans）没有 URL 前缀，落到最后的中文404。
        # 非默认 locale 统一返回对应语言的 404 页面；新增 locale 时同步此正则。
        if ($uri ~ ^/(ar|bn|de|en|es|fa|fr|hy|id|it|ja|ko|nl|pt|ru|tr|uk|vi|zh-Hant)/) {
            return 302 /$1/404.html;
        }
        # 默认返回中文404页面
        return 302 /404.html;
    }

    # 确保404.html能够正常访问
    location = /404.html {
        # 移除 internal 指令，允许直接访问404页面
        try_files $uri =404;
    }

    # 确保各语言版 404.html 能够正常访问（否则上面的 302 会再次触发 error_page）。
    location ~ ^/(ar|bn|de|en|es|fa|fr|hy|id|it|ja|ko|nl|pt|ru|tr|uk|vi|zh-Hant)/404\.html$ {
        try_files $uri =404;
    }

    # 尝试文件，如果不存在则显示404页面
    location / {
        try_files $uri $uri/index.html $uri/ /404.html;
    }

    # 缓存静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
