name: Release

on:
  push:
    branches:
      - main
      - release/*

env:
  APP_NAME: scriptcat-docs
  NAMESPACE: app
  REGISTRY: ${{ secrets.DOCKER_REGISTRY && secrets.DOCKER_REGISTRY || 'docker.io' }}
  REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR && secrets.DOCKER_REGISTRY_MIRROR || '' }}
  REPOSITORY: ${{ github.repository }}
  DOMAIN: docs.scriptcat.org
  ENV: ${{ startsWith(github.ref, 'refs/heads/release/') && 'pre' || startsWith(github.ref, 'refs/heads/test/') && 'test' || github.ref=='refs/heads/main' && 'prod' }}
  RUNNER_TOOL_CACHE: /toolcache
  BASEIMAGE: ${{ secrets.BASEIMAGE && secrets.BASEIMAGE || '' }}

# Same locale sharding as ci.yaml -- see the comment there for why. The extra
# job here is `stats`: `pnpm run build` used to refresh the landing-page numbers
# through its `prebuild` hook, but four shards each running that hook would make
# four independent scrapes and could bake different numbers into different
# locales. So it is scraped once and handed to the shards as an artifact.
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20.x"

    # The script never regresses a metric to 0 and always exits 0: on any
    # failure it keeps the value committed in src/data/landing-stats.json.
    - name: Refresh landing page stats
      run: node scripts/fetch-landing-stats.mjs

    - name: Upload landing stats
      uses: actions/upload-artifact@v4
      with:
        name: landing-stats
        path: src/data/landing-stats.json
        retention-days: 1

  build:
    needs: stats
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v3
    - uses: pnpm/action-setup@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20.x"
        cache: 'pnpm'

    - name: Install
      run: pnpm install --frozen-lockfile

    - name: Download landing stats
      uses: actions/download-artifact@v4
      with:
        name: landing-stats
        path: src/data

    # See ci.yaml for why this is an exact-match key with no restore-keys.
    - name: Restore rspack cache
      uses: actions/cache@v4
      with:
        path: node_modules/.cache/rspack
        key: rspack-v1-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml', 'docusaurus.config.js', 'sidebars.js', 'tailwind.config.js', 'scripts/check-config.json') }}

    - name: Build locales (shard ${{ matrix.shard }}/4)
      run: pnpm run build:shard -- --shard ${{ matrix.shard }}/4

    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.shard }}
        path: build
        retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: pnpm/action-setup@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20.x"
        cache: 'pnpm'

    - name: Install
      run: pnpm install --frozen-lockfile

    # The shards write disjoint paths (the default locale owns build/ itself,
    # every other locale owns only build/<locale>/), so download order does not
    # matter. The Dockerfile copies this merged tree.
    - name: Download shard 1
      uses: actions/download-artifact@v4
      with:
        name: build-1
        path: build
    - name: Download shard 2
      uses: actions/download-artifact@v4
      with:
        name: build-2
        path: build
    - name: Download shard 3
      uses: actions/download-artifact@v4
      with:
        name: build-3
        path: build
    - name: Download shard 4
      uses: actions/download-artifact@v4
      with:
        name: build-4
        path: build

    - name: Check
      run: pnpm run check

    - name: Set up QEMU
#      uses: docker/setup-qemu-action@v3
      uses: actions/setup-qemu-action@v3

    - name: Set up Docker Buildx
#      uses: docker/setup-buildx-action@v3
      uses: actions/setup-buildx-action@v3

    - name: Login to Docker Hub
#      uses: docker/login-action@v3
      uses: actions/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Set outputs
      id: vars
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Docker build and push
#      use: docker/build-push-action@v5
      uses: actions/build-push-action@v6
      with:
        push: true
        file: deploy/docker/Dockerfile
        tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ steps.vars.outputs.sha_short }}
        context: .
        build-args: |
          BASEIMAGE=${{ env.BASEIMAGE }}/nginx:1.25

    - name: Set up kubeconfig
#      uses: azure/k8s-set-context@v3
      uses: actions/k8s-set-context@v4
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}
        context: k8s-context

    - name: Set up Helm
#      uses: azure/setup-helm@v3
      uses: actions/setup-helm@v4

    - name: Deploy ${{ env.ENV }}
      env:
        RESOURCE_CPU: ${{ env.ENV=='prod' && '100m' || '50m' }}
        RESOURCE_MEMORY: ${{ env.ENV=='prod' && '256Mi' || '128Mi' }}
      run: |
        cd deploy/helm
        helm upgrade --install \
        --namespace $NAMESPACE $APP_NAME . \
        -f values.yaml \
        --set image.tag=${{ steps.vars.outputs.sha_short }} \
        --set image.repository=$REGISTRY/$REPOSITORY \
        --set resources.requests.cpu=$RESOURCE_CPU \
        --set resources.requests.memory=$RESOURCE_MEMORY
