name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release/*

env:
  RUNNER_TOOL_CACHE: /toolcache

# A `docusaurus build` compiles every locale sequentially in a single, almost
# entirely single-threaded process, so with 20 locales the wall time is 20x one
# locale while the runner sits at roughly one core. The locales are therefore
# split across parallel `build` jobs and stitched back together in `check`,
# which needs the whole tree. Changing the shard count means editing the matrix
# below *and* the `/4` in the build step and the download steps in `check`.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: pnpm/action-setup@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20.x"
        cache: 'pnpm'

    - name: Install
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      run: pnpm run typecheck

  build:
    runs-on: ubuntu-latest
    strategy:
      # One shard failing shouldn't hide breakage in the other locales.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v3
    - uses: pnpm/action-setup@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20.x"
        cache: 'pnpm'

    - name: Install
      run: pnpm install --frozen-lockfile

    # Without this every run recompiles all 20 locales from scratch: the rspack
    # persistent cache that `future.faster` enables lives here and was never
    # restored, which is why the "cold build 500s -> 65s" number from enabling
    # `faster` only ever showed up locally. Roughly 70 MB per locale.
    #
    # Exact-match key, no restore-keys: rspack namespaces its entries per locale
    # but keys them on a config hash it computes itself, and feeding it a cache
    # built from a different config has produced broken output (a missing server
    # bundle, a truncated client manifest) instead of a clean miss. A config or
    # dependency change should mean a cold build, not a half-warm one.
    - name: Restore rspack cache
      uses: actions/cache@v4
      with:
        path: node_modules/.cache/rspack
        key: rspack-v1-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml', 'docusaurus.config.js', 'sidebars.js', 'tailwind.config.js', 'scripts/check-config.json') }}

    - name: Build locales (shard ${{ matrix.shard }}/4)
      run: pnpm run build:shard -- --shard ${{ matrix.shard }}/4

    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.shard }}
        path: build
        retention-days: 1

  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: pnpm/action-setup@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20.x"
        cache: 'pnpm'

    - name: Install
      run: pnpm install --frozen-lockfile

    # check:fallbacks reads the generated HTML, so the shards have to be merged
    # back into one build/ first. They write disjoint paths -- the default locale
    # owns build/ itself, every other locale owns only build/<locale>/ -- so the
    # download order does not matter.
    - name: Download shard 1
      uses: actions/download-artifact@v4
      with:
        name: build-1
        path: build
    - name: Download shard 2
      uses: actions/download-artifact@v4
      with:
        name: build-2
        path: build
    - name: Download shard 3
      uses: actions/download-artifact@v4
      with:
        name: build-3
        path: build
    - name: Download shard 4
      uses: actions/download-artifact@v4
      with:
        name: build-4
        path: build

    - name: Check URL inventory, i18n parity, and frontmatter conventions
      run: pnpm run check
