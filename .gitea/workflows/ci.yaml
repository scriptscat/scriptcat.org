name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release/*

env:
  RUNNER_TOOL_CACHE: /toolcache

# One job, one `docusaurus build`, no artifacts and no build cache. This was
# briefly four sharded build jobs stitched back together through artifacts, on
# the theory that 20 sequential locale builds were worth parallelising. Measured
# on the full locale set, they are not:
#
#   all 20 locales, one process, rspack cache warm   39s
#   all 20 locales, one process, rspack cache cold   56-83s across runs
#
# So sharding could save a minute at best, while costing three extra
# `pnpm install`s, four cache restores, and a 187 MB `build/` tree pushed
# through upload-artifact and pulled back down by the job that runs the checks.
# Carrying the rspack cache between runs went for the same reason: it saves the
# gap between those two rows, and costs a 1.6 GB directory shipped to and from
# the Gitea cache server every time.
#
# That is only about *restoring* the cache between runs. rspack's persistent
# cache itself stays enabled -- the 20 locales compile in one process and share
# it, so the later ones hit what the first one wrote. Do not switch it off
# without measuring; see the `faster` block in docusaurus.config.js.
#
# Dropping the artifacts also sidesteps a wall: upload-artifact@v4+ bundles
# @actions/artifact v2, which refuses to run when GITHUB_SERVER_URL's host is
# not github.com / *.ghe.com / *.localhost -- it cannot tell Gitea from GHES and
# fails with GHESNotSupportedError before contacting the server. v3 works but
# uploads file by file, which is slow for a tree this size.
#
# If the locale count grows enough to make this hurt again, shard by *runner*
# rather than by artifact: give each job the whole `pnpm run check` too, so
# nothing has to be stitched back together.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: pnpm/action-setup@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20.x"
        cache: 'pnpm'

    - name: Install
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      run: pnpm run typecheck

    # `docusaurus build` rather than `pnpm run build`, to skip the latter's
    # prebuild hook: that scrapes the landing page stats off the network, which
    # only the deploy has any reason to do. Every locale is built -- a broken
    # link or anchor only fails the build in the locale that contains it.
    - name: Build every locale
      run: npx docusaurus build

    # Needs the build/ output above: check:fallbacks reads the generated HTML.
    - name: Check URL inventory, i18n parity, and frontmatter conventions
      run: pnpm run check
